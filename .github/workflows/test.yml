# Every push and pull request: the unit tests (with the lint), the build, and
# the art snapshots (every unit and terrain picture, against its fingerprint).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save eslint@9 terser@5
      - run: npm test
      - run: npm run build
  # A GitHub runner draws the edges of most pictures a level or two apart from
  # the machine the baseline was taken on, so here the pictures are held to
  # their grids (test/art/print.js), not pixel for pixel.
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/browser/artsnap.js
      - run: node test/browser/terrainsnap.js
        if: success() || failure()
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: art-diff
          path: test/art/diff/
