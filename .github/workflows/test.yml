# Every push and pull request: the unit tests (with the lint), the build, and
# the art snapshots (every unit and terrain picture, against its fingerprint).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save eslint@9 terser@5
      - run: npm test
      - run: npm run build
  # The art fingerprints are exact, and a GitHub runner draws the edges of
  # most pictures a little differently from the machine they were taken on,
  # even in the same Chromium (1194, what the pinned Playwright 1.56.1
  # installs): so this job reports but does not block. The pictures are
  # checked where they were taken: node test/browser/artsnap.js
  art:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/browser/artsnap.js
      - run: node test/browser/terrainsnap.js
