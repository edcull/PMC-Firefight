<title>PMC 2670 — Unit viewer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/css/base.css?v=329d713235">

<header>
  <a class="vhome" id="vhome" href="index.html" title="The game's main menu" aria-label="The game's main menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <button type="button" class="vunits" id="vunits" aria-controls="vside" aria-expanded="false">☰ Units</button>
  <h1>Unit viewer</h1>
  <p>Every profile in all four armies, in each state, walking and firing — drawn and sounded by the game's own code.</p>
  <span class="keys">tap the stage or <kbd>F</kbd> fire · <kbd>W</kbd> walk · <kbd>I</kbd> insert · <kbd>S</kbd> state · <kbd>A</kbd> ability</span>
</header>

<div class="vscrim" id="vscrim"></div>
<main>
  <div class="vpanel vside" id="vside">
    <h3>Units <button type="button" class="vclose" id="vclose" aria-label="Close the unit list">×</button></h3>
    <div class="vfacs" id="vfacs" role="tablist" aria-label="Army"></div>
    <div class="vsearchbar"><input id="vsearch" placeholder="Search by unit name — e.g. rangers, hunter…" autocomplete="off"></div>
    <div class="vscroll vlistscroll">
      <div id="vlist" class="atl"></div>
    </div>
  </div>

  <div class="vstage">
    <!-- the colours the unit wears: a swatch, and the whole set dropped down from it -->
    <div class="vcolbtn" id="vcolbtn"></div>
    <div class="vzoom" id="vzoom" aria-label="Zoom">
      <button type="button" data-vzoom="wide" title="Zoom out, to the whole firing line (−)">Wide</button>
      <button type="button" data-vzoom="close" title="Zoom in, close on the unit (+)">Close</button>
    </div>
    <canvas id="vboard"></canvas>
  </div>

  <div class="vpanel vctlpanel">
    <div id="vctl"></div>
  </div>
</main>
