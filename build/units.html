<title>PMC 2670 Unit Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef0ec; --panel: #fbfcfa; --ink: #1c211d; --muted: #5a645c; --line: #d3d9d1;
  --accent: #946618; --accent-ink: #ffffff; --chip: #e2e6df; --field: #5e5039; --field-edge: #4a3f2d;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --panel: #181d1a; --ink: #e3e8e2; --muted: #95a198; --line: #2b332e;
    --accent: #d8a13a; --accent-ink: #1a1408; --chip: #232a26; --field: #5e5039; --field-edge: #2e271c;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --panel: #181d1a; --ink: #e3e8e2; --muted: #95a198; --line: #2b332e;
  --accent: #d8a13a; --accent-ink: #1a1408; --chip: #232a26; --field: #5e5039; --field-edge: #2e271c;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); margin: 0; }
a { color: inherit; }
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-inline: 20px; padding-block: 0 48px; max-width: 1500px; margin: 0 auto; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 28px; padding-block: 22px 14px; border-bottom: 1px solid var(--line); }
header.top h1 { font: 700 34px/1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
header.top h1 span { color: var(--accent); }
header.top p { margin: 0; color: var(--muted); max-width: 60ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, input:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input#q { font: 14px var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 220px; max-width: 100%; }
label.ctl { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }

nav.index { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 18px; font-size: 13px; }
nav.index h2 { font: 700 18px var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 4px; }
nav.index h3 { font: 600 12px var(--display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 12px 0 2px; }
nav.index ul { list-style: none; margin: 0; padding: 0; }
nav.index a { display: grid; grid-template-columns: 38px 1fr; gap: 6px; text-decoration: none; padding: 2px 4px; border-radius: 4px; }
nav.index a:hover { background: var(--chip); }
nav.index a b { font: 500 11px/1.9 var(--mono); color: var(--accent); }
details.mobile-index { display: none; }

main h2.faction { font: 700 28px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 30px 0 4px; }
main h3.group { font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
article.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; margin-bottom: 14px; scroll-margin-top: 12px; }
article.unit header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.code { font: 600 13px var(--mono); background: var(--accent); color: var(--accent-ink); padding: 2px 7px; border-radius: 4px; }
.uname { font: 600 21px/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.meta code { font: 12px var(--mono); }
.sheet { overflow-x: auto; }
.grid { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 74px repeat(8, 132px); gap: 6px; align-items: center; min-width: max-content; }
.row.head div { font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.row .lab { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.strip { display: flex; flex-wrap: wrap; gap: 6px; }
figure.cell { margin: 0; }
figure.cell figcaption { font: 600 11.5px var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-align: center; padding-top: 3px; }
canvas.tile { display: block; width: 132px; height: 112px; background: radial-gradient(ellipse at 50% 60%, #6b5c43 0%, var(--field) 55%, var(--field-edge) 100%); border-radius: 5px; }
canvas.tile.tall { height: 150px; }
canvas.tile.inf { width: 150px; height: 118px; }
.bar2 { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches button { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; padding: 6px 10px 6px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; }
.swatches button i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.swatches button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { font: 600 12.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; }
.toggles button::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 1.5px solid currentColor; border-radius: 2px; vertical-align: -1px; }
.toggles button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
.toggles button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.swatches button:focus-visible, .toggles button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.card.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 10px; width: min-content; scroll-margin-top: 12px; display: flex; flex-direction: column; }
/* names wrap to different heights: the pictures sit on the card's floor, so every picture in a row lines up */
.card.unit .tiles { margin-top: auto; align-items: flex-end; }
.card.unit h4 { contain: inline-size; }
.card.unit h4 { margin: 0 0 4px; display: flex; gap: 6px; align-items: baseline; }
.card.unit h4 .tier { font: 500 11px var(--mono); color: var(--muted); margin-left: auto; }
.card.unit .nm { font: 600 15px/1.15 var(--display); letter-spacing: .02em; min-height: 2.35em; margin-bottom: 6px; contain: inline-size; text-wrap: balance; }
.card.unit h4 .tier, .card.unit h4 .code { flex-shrink: 0; }
.card .tiles { display: flex; gap: 6px; }
.card .cap { font: 600 11px var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-align: center; padding-top: 3px; }
.strip .cell canvas.tile.tall { height: 150px; }
.empty { color: var(--muted); padding: 30px 0; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; }
  nav.index { display: none; }
  details.mobile-index { display: block; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 12px; }
  details.mobile-index summary { font: 600 14px var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  details.mobile-index nav.index { display: block; position: static; max-height: 60vh; }
  .controls { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
</style>

<div class="wrap">
  <header class="top">
    <h1>PMC 2670 <span>Unit Atlas</span></h1>
    <p>Every profile in both army lists, drawn by the game’s own renderer. Pick a company colour; turn on the states, facings, movement types and wrecks you want to compare.</p>
    <div class="controls">
      <input id="q" type="search" placeholder="Find a unit — name or code" aria-label="Find a unit">
    </div>
    <div class="bar2">
      <label class="ctl">Colours</label>
      <div class="swatches" id="colours" role="group" aria-label="Company colours"></div>
    </div>
    <div class="bar2">
      <label class="ctl">Show</label>
      <div class="toggles" id="toggles" role="group" aria-label="What to show">
        <button type="button" data-t="states" aria-pressed="false">Suppressed &amp; broken</button>
        <button type="button" data-t="facings" aria-pressed="false">All facings</button>
        <button type="button" data-t="props" aria-pressed="false">Movement types</button>
        <button type="button" data-t="wrecks" aria-pressed="false">Destroyed</button>
      </div>
    </div>
    <details class="mobile-index"><summary>Index</summary><nav class="index" id="index-m"></nav></details>
  </header>
  <nav class="index" id="index" aria-label="Unit index"></nav>
  <main id="main"></main>
</div>

<script>/* PMC 2670 — Firefight
   Rules engine: profiles, free-measurement geometry, combat resolution.
   Everything is measured in inches on a 48" x 36" table, exactly as on the tabletop.
   A unit is a token with a 1" radius; ranges are measured edge to edge, the way you
   measure between the two closest models.
*/
(function (root) {
  'use strict';

  var BOARD = { w: 48, h: 48 };   // 4' x 4', the book's recommended table for PL1-2
  var UNIT_R = 1.0;          // token radius in inches
  var STEP = 0.5;            // movement lattice resolution in inches

  /* ---------- dice ---------- */
  function d10() { return Math.floor(Math.random() * 10); }      // reads 0-9
  function d6() { return 1 + Math.floor(Math.random() * 6); }

    /* Basic troops (p. 62) */
    { key: 'recruits', code: 'REC', name: 'Recruits', group: 'Basic troops', art: 'recruit', tier: 1, size: 8, move: 4, fp: 1, range: 18, def: 8, assault: 1, morale: 3, rules: [] },
    { key: 'enforcers', code: 'ENF', name: 'Enforcers', group: 'Basic troops', art: 'enforcer', tier: 1, size: 6, move: 3, fp: 2, range: 12, def: 9, assault: 3, morale: 3, rules: [] },
    { key: 'irregulars', code: 'IRR', name: 'Irregular troops', group: 'Basic troops', art: 'irregular', tier: 1, size: 8, move: 6, fp: 2, range: 12, def: 7, assault: 2, morale: 3, rules: [] },
    { key: 'penal', code: 'PEN', name: 'Penal troops', group: 'Basic troops', art: 'penal', tier: 1, size: 8, move: 5, fp: 1, range: 12, def: 6, assault: 2, morale: 3, rules: ['Determined', 'Expendable'], cap: 4 },

    /* Rifle infantry (p. 63) */
    { key: 'rookie', code: 'RKI', name: 'Rookie rifle team', group: 'Rifle infantry', art: 'rookie', tier: 2, size: 8, move: 4, fp: 2, range: 18, def: 9, assault: 2, morale: 4, rules: [] },
    { key: 'regular', code: 'RIF', name: 'Regular rifle team', group: 'Rifle infantry', art: 'rifle', tier: 3, size: 8, move: 5, fp: 3, range: 18, def: 10, assault: 3, morale: 5, rules: [] },
    { key: 'veterans', code: 'VET', name: 'Veterans', group: 'Rifle infantry', art: 'veteran', tier: 4, size: 8, move: 5, fp: 4, range: 18, def: 11, assault: 3, morale: 5, rules: [] },
    { key: 'rangers', code: 'RNG', name: 'Rangers', group: 'Rifle infantry', art: 'ranger', tier: 5, size: 8, move: 5, fp: 4, range: 18, def: 11, assault: 4, morale: 5, rules: ['Determined'] },

    { key: 'lighteng', code: 'LEN', name: 'Light engineer team', group: 'Assault troops', art: 'lighteng', tier: 2, size: 8, move: 6, fp: 3, range: 12, def: 8, assault: 3, morale: 4, rules: ['Sappers'] },

    { key: 'commandos', code: 'CDO', name: 'Commandos', group: 'Assault troops', art: 'commando', tier: 5, size: 8, move: 5, fp: 5, range: 12, def: 11, assault: 6, morale: 5, rules: ['Determined', 'Sappers', 'Destructive Weapon'] },

    { key: 'ecobats', code: 'EBA', name: 'Economy-class BATs', group: 'Heavy infantry', art: 'armour', tier: 2, size: 4, move: 3, fp: 3, range: 12, def: 11, defPierced: 9, assault: 3, morale: 4, rules: ['Battle Armour', 'Anti-tank (limited)'] },

    { key: 'lmgteam', code: 'MG', name: 'Light MG team', group: 'Light support', art: 'mg', tier: 3, size: 6, move: 4, fp: 5, range: 24, def: 8, assault: 1, morale: 4, rules: [] },
    { key: 'hmgteam', code: 'HMG', name: 'Heavy MG team', group: 'Light support', art: 'hmg', tier: 4, size: 3, move: 3, fp: 5, range: 30, def: 9, assault: 1, morale: 5, rules: ['Cumbersome Weapon', 'Suppressive Fire'] },

    { key: 'sam', code: 'SAM', name: 'SAM team', group: 'Heavy support', art: 'samlauncher', tier: 3, size: 4, move: 3, fp: 6, range: 30, def: 9, assault: 1, morale: 4, rules: ['Specialisation (air)', 'Cumbersome Weapon', 'Indirect Fire', 'Anti-aircraft'], capPL: 1 },

    /* Remote mortar units (p. 69) */
    { key: 'mortarsection', code: 'MRS', name: 'Remote mortar section', group: 'Remote mortars', art: 'mortar', tier: 1, size: 2, move: 3, fp: 3, range: 48, def: 7, assault: 1, morale: 3, rules: ['Cumbersome Weapon', 'Indirect Fire', 'Destructive Weapon', 'Minimum Range (12)', 'Specialisation (ground)', 'Suppressive Fire'] },
    { key: 'mortarteam', code: 'MRT', name: 'Remote mortar team', group: 'Remote mortars', art: 'mortar', tier: 2, size: 4, move: 3, fp: 3, range: 48, def: 7, assault: 1, morale: 4, rules: ['Cumbersome Weapon', 'Indirect Fire', 'Destructive Weapon', 'Minimum Range (12)', 'Specialisation (ground)', 'Suppressive Fire'] },
    { key: 'mortarbattery', code: 'MRB', name: 'Remote mortar battery', group: 'Remote mortars', art: 'mortar', tier: 3, size: 8, move: 3, fp: 3, range: 48, def: 7, assault: 1, morale: 5, rules: ['Cumbersome Weapon', 'Indirect Fire', 'Destructive Weapon', 'Minimum Range (12)', 'Specialisation (ground)', 'Suppressive Fire'] },

  // `inAssault`: Intense Pheromone Markers count double for Firepower only (p. 125)

    if (!state || !has(a, 'Animal Behaviour') || campFlag(a, 'deafSenses')) return 0;
    var reach = doctrine(state, a.side, 'BC3') ? 24 : 18, n = 0;
    state.units.forEach(function (o) {
      if (o.side !== a.side || !projects(o) || !has(o, 'Pheromone Markers')) return;   // steady markers only (p. 28)
      if (unitDist(o, t) <= reach) n += campFlag(o, 'intensePheromones') && !inAssault ? 2 : 1;
    });
    return Math.min(3, n);
  }
  // Aggressive: forced to charge the closest enemy — unless an Overmind holds it back
  function aggressiveNow(state, u) {
    if (!has(u, 'Aggressive') || isMachine(u)) return false;
    return !overmindFor(state, u, false, true);
  }
  /* Endless Tide, in the End phase: an unbroken unit near an unsuppressed
     Overmind digs D3 lost bugs back out of the ground. */
  function endlessTide(state) {
    var log = [];
    state.units.forEach(function (u) {
      if (!onBoard(u) || !has(u, 'Endless Tide') || status(u) === 'broken') return;
      var full = u.startSize || u.size;
      if (u.models >= full || !overmindFor(state, u, true, true)) return;
      var n = Math.min(d3(), full - u.models);
      u.models += n;
      log.push({ t: 'rally', text: 'Endless Tide — ' + n + ' more bug' + (n === 1 ? '' : 's') + ' crawl out to join ' + u.label + ' (' + u.models + '/' + full + ').', unit: u, n: n });
    });
    return log;
  }
  /* Psychic Wave (p. 116): every enemy within 12" — no line of sight needed,
     Drones excepted — takes D6-1 Suppression. */
  function psychicWave(state, u) {
    var log = [], hit = [];
    log.push({ t: 'assault', text: u.label + ' sends out a Psychic Wave.' });
    state.units.forEach(function (e) {
      if (!onBoard(e) || e.side === u.side || e.drone || has(e, 'Drone Control')) return;
      if (unitDist(u, e) > 12) return;
      if (campFlag(e, 'shielding')) { log.push({ t: 'note', text: e.label + ' — Rite of Shielding: untouched.' }); return; }
      var n = Math.max(0, d6() - 1);
      if (n) addSP(e, n);
      hit.push(e);
      log.push({ t: n ? 'hits' : 'note', text: e.label + ' — D6−1 = ' + n + ' SP' + (n ? ' (' + status(e) + ')' : ', shrugs it off') + '.' });
    });
    if (!hit.length) log.push({ t: 'note', text: 'Nobody within 12" to feel it.' });
    return { log: log, hit: hit };
  }

  function coverFor(state, attacker, target) {
    if (campFlag(target, 'dumb')) return { v: 0, why: '' };   // Tactical Dumbness
    // Flying Infantry get nothing from the ground; Animal Behaviour bugs only under an Overmind
    if (flyInf(target)) return { v: 0, why: '' };
    if (has(target, 'Animal Behaviour') && !overmindFor(state, target, false)) return { v: 0, why: '' };
    var here = TERRAIN[terrainAt(state, target.x, target.y)].cover;
    /* Last Stand (p. 95): Rebel infantry "get +4 to their Defence parameter when in
       terrain which grants a Defence bonus" — behind a low wall as much as in ruins. */
    var stand = target.tactic === 'laststand' && target.faction === 'rebel' && target.cls === 'infantry';
    function held(v, why) { return stand ? { v: Math.max(v, 4), why: why + ' — Last Stand' } : { v: v, why: why }; }
    if (here) return held(here, 'terrain cover');
    // a dug-in gun sits behind its own sandbags, which count as cover (p. 94)
    if (dugIn(target)) return { v: 2, why: 'dug in behind sandbags' };
    if (!attacker) return { v: 0, why: '' };
    // Indirect Fire falls from above, so a low wall shelters the target whichever
    // way the shot comes from
    /* Low walls (p. 42): "When a whole unit is behind a low wall (up to 2" from
       it), it gets a Defence bonus" — so every model within 2", which for a
       token of radius 1" means its middle within an inch of the wall, and the
       wall between it and the shooter. Rubble and the like shelter only the
       men standing in them, which the lines above already give. */
    var plunging = has(attacker, 'Indirect Fire');
    for (var i = 0; i < state.terrain.length; i++) {
      var r = state.terrain[i], t = TERRAIN[r.kind];
      if (r.kind !== 'barricade') continue;
      if (inRect(attacker.x, attacker.y, r)) continue;
      if (rectPointDist(r, target.x, target.y) + UNIT_R > 2 + 1e-6) continue;
      // Indirect Fire falls from above, so the wall shelters them whichever way it comes
      if (plunging) return held(t.cover, 'low wall against plunging fire');
      if (segRect(attacker.x, attacker.y, target.x, target.y, r)) return held(t.cover, 'behind a low wall');
    }
    return { v: 0, why: '' };
  }
  function clampTo(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function defenceAgainst(state, attacker, target, opts) {
    opts = opts || {};
    var parts = [], def = target.def;
    parts.push({ label: 'Defence', v: target.def });
    if (has(target, 'Battle Armour') && attacker &&
      (antiTank(attacker, unitDist(attacker, target)) || has(attacker, 'Gauss Weapon'))) {
      var pierced = target.defPierced != null ? target.defPierced : target.def - 2;
      parts.push({ label: 'armour pierced', v: pierced - def });
      def = pierced;
    }
    var tProp = propOf(target);
    if (!opts.assault && !opts.noCover && (!isMachine(target) || (tProp && tProp.cover))) {  // only walkers, among machines
      var cov = coverFor(state, attacker, target);
      if (cov.v && !has(target, 'Battle Armour') && !(attacker && has(attacker, 'Gauss Weapon'))) {
        // Rite of Invisibility (p. 142): +3 from terrain rather than +2
        var cv = cov.v === 2 && campFlag(target, 'invisibility') ? 3 : cov.v;
        def += cv; parts.push({ label: cov.why + (cv !== cov.v ? ' — Rite of Invisibility' : ''), v: cv });
      }
    }
    /* Stealth (p. 59) is not cover: a hull has it too (the Shadow bug), and it
       holds against defensive fire, which only strips terrain bonuses. */
    if (!opts.assault && has(target, 'Stealth') && attacker && !has(attacker, 'Keen-Eyed')) {
      var st = Math.floor(unitDist(attacker, target) / 6);
      if (st > 0) { def += st; parts.push({ label: 'Stealth', v: st }); }
    }
    // Shield Generator (p. 130): a dome against fire from outside it
    if (!opts.assault && attacker) {
      var sh = shieldFor(state, attacker, target);
      if (sh) { def += sh.v; parts.push({ label: 'Shield Generator (' + sh.from.name + ')', v: sh.v }); }
    }
    // Overloaded Energy Shields: +4 when shot at during an assault, which is the
    // defensive fire a charge draws
    if (opts.defensiveFire && campFlag(target, 'shields')) {
      def += 4; parts.push({ label: 'Overloaded Energy Shields', v: 4 });
    }
    if (opts.assault && doctrine(state, target.side, 'T4')) {
      def += 1; parts.push({ label: 'Improved HTH Training', v: 1 });
    }
    // Chitin Exoskeletons: Lesser and Underground Bugs +2 in assaults (p. 124)
    if (opts.assault && bugGround(target) && doctrine(state, target.side, 'BP5')) {
      def += 2; parts.push({ label: 'Chitin Exoskeletons', v: 2 });
    }
    return { value: def, parts: parts };
  }

  /* p. 28: "Both suppressed and broken unit cannot use their passive skills which
     grants bonuses to another units, such like Inspire presence, Field medics,
     Pheromone markers etc. Please note that this applies to bonuses only, but not
     for penalties (the life is unfair, I know...)".

     So this gate is for auras that HELP a friend — Inspiring Presence, Field
     Medics, Counter-jamming, "…but they'll never take our freedom!". It is not
     used for Jammers, which is a penalty on the enemy and keeps working from a
     unit that is pinned down or running. A unit riding inside a vehicle is not
     projecting anything either; a Command Vehicle carries its passenger's rules
     on the hull itself, so that case still reaches the table. */
  /* A Rapid insertion platform is scenery with a door (p. 79): it cannot take or
     contest an objective, and when it is shot to pieces it counts for nobody's
     victory conditions. */
  function holdsGround(u) { return !hasOwn(u, 'No Objectives'); }
  function countsForVictory(u) { return !hasOwn(u, 'No Objectives'); }

  // on the table and steady: a unit still in reserve, or riding inside, projects nothing
  function projects(u) {
    return !!u.alive && !u.aboard && !u.reserve && u.x >= 0 && status(u) === 'ready';
  }

  /* ---------- hit tables ---------- */
  /* Psychic Support (p. 130) counts as Field Medics — to 12" with Mind
     Amplifiers (p. 142). */
  function isMedic(u) { return has(u, 'Field Medics') || has(u, 'Psychic Support'); }
  function medicReach(state, u) { return has(u, 'Psychic Support') && doctrine(state, u.side, 'XT5') ? 12 : 6; }
  // the unit treating a squad's wounded: itself if it is the medics, else the nearest in reach
  function medicFor(state, target) {
    // the medic team treats its own wounded whatever state it is in (p. 57)
    if (isMedic(target)) return target;
    var best = null, bd = Infinity;
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i], d;
      if (u.side === target.side && projects(u) && isMedic(u)
        && (d = unitDist(u, target)) <= medicReach(state, u) && d < bd) { best = u; bd = d; }
    }
    return best;
  }
  function medicNearby(state, target) { return !!medicFor(state, target); }

  function resolveShootingHits(state, target, hits, mod, atk) {
    var out = { casualties: 0, sp: 0, rolls: [], notes: [] };
    // "When resolving hits inflicted on a drone unit (both in shooting and assault), add 1 to the result" (p. 40)
    if (droneUnit(target)) { mod = (mod || 0) + 1; out.notes.push('Drone unit +1 to hit rolls'); }
    var medic = medicFor(state, target), medics = !!medic;
    var drugs = doctrine(state, target.side, 'T1');      // Combat Drugs
    var suicidal = campFlag(target, 'suicidal');         // Suicidal Tendencies
    for (var i = 0; i < hits; i++) {
      var raw = d6(), r = raw + mod, tag, down = false;
      if (suicidal) {
        // ignores hits on 1-2, but goes down on a 5-6
        if (r <= 2) tag = 'Steady, boys!';
        else if (r <= 4) { tag = 'Get down! (1 SP)'; out.sp += 1; }
        else { tag = 'Man down! (1 model, 2 SP)'; down = true; }
      } else if (medics) {
        if (r <= 2) tag = 'Steady, boys!';
        else if (r <= 5) { tag = 'Get down! (1 SP)'; out.sp += 1; }
        else if (d6() === 6) { tag = 'MEDIC! casualty stabilised (1 SP)'; out.sp += 1; out.medic = medic.id; }
        // Combat Drugs stack with Field Medics (p. 87): the man the medic lost may still get up
        else if (drugs && d6() === 6) { tag = 'MEDIC! man down — Combat Drugs: he gets back up (1 SP)'; out.sp += 1; out.medic = medic.id; }
        else { tag = 'MEDIC! man down (1 SP)'; out.casualties += 1; out.sp += 1; out.medic = medic.id; }
      } else if (has(target, 'Animal Behaviour')) {
        // bugs: shrug it off or burst (p. 116)
        if (r <= 3) tag = 'QUEKKK! (ignored)';
        else { tag = 'SPLASH! (1 bug, 2 SP)'; down = true; }
      } else {
        if (r <= 1) tag = 'Steady, boys!';
        else if (r <= 5) { tag = 'Get down! (1 SP)'; out.sp += 1; }
        else { tag = 'Man down! (1 model, 2 SP)'; down = true; }
      }
      if (down) {
        var saved = drugs && d6() === 6;
        // Adamantium Exoskeletons (an Adaptation): shrugs it off on a 5+
        var shell = !saved && campFlag(target, 'adamantium') && d6() >= 5;
        if (saved) { tag = 'Man down! — Combat Drugs: he gets back up (1 SP)'; out.sp += 1; }
        else if (shell) { tag += ' — Adamantium Exoskeletons: ignored'; }
        else { out.casualties += 1; out.sp += campFlag(target, 'overreact') ? 4 : 2; }
      }
      out.rolls.push('D6 ' + raw + (mod ? '+' + mod : '') + ' → ' + tag);
    }
    // Style Bonus on the firer: one more point of suppression per man killed
    if (atk && campFlag(atk, 'style') && out.casualties) {
      out.sp += out.casualties;
      out.notes.push('Style Bonus +' + out.casualties + ' SP');
    }
    // Brave shrugs one point off every ranged attack
    if (campFlag(target, 'brave') && out.sp > 0) { out.sp -= 1; out.notes.push('Brave -1 SP'); }
    // Courage Under Fire: the second and later attacks on a unit in the same turn
    if (target.shotFrom && target.shotFrom.length > 1 && doctrine(state, target.side, 'T2') && out.sp > 0) {
      out.sp -= 1; out.notes.push('Courage Under Fire -1 SP');
    }
    return out;
  }

  function resolveAssaultHits(target, hits, mod, atk) {
    mod = (mod || 0) + (droneUnit(target) ? 1 : 0);          // drone units, p. 40
    var out = { casualties: 0, sp: 0, rolls: [], notes: [] };
    var nbk = campFlag(atk, 'nbk');                     // Natural Born Killers
    for (var i = 0; i < hits; i++) {
      var raw = d6(), r = raw + mod, tag;
      var down = false;
      if (target && has(target, 'Animal Behaviour')) {
        if (r <= 3) tag = 'QUEKKK! (ignored)';
        else { tag = 'SPLASH! (1 bug, 2 SP)'; down = true; }
      } else if (nbk) {
        if (r <= 1) tag = 'Keep fighting!';
        else { tag = 'Man down! (1 model, 2 SP)'; down = true; }
      } else if (r <= 1) tag = 'Keep fighting!';
      else if (r <= 3) { tag = 'Ouch! (1 SP)'; out.sp += 1; }
      else { tag = 'Man down! (1 model, 2 SP)'; down = true; }
      if (down) {
        if (campFlag(target, 'adamantium') && d6() >= 5) tag += ' — Adamantium Exoskeletons: ignored';
        else { out.casualties += 1; out.sp += campFlag(target, 'overreact') ? 4 : 2; }
      }
      out.rolls.push('D6 ' + raw + (mod ? '+' + mod : '') + ' → ' + tag);
    }
    if (nbk) out.notes.push('Natural Born Killers: down on a 2+');
    return out;
  }

  function applyResult(state, target, res, log, atk) {
    var before = status(target);
    if (target.minModels == null) target.minModels = target.models;
    addSP(target, res.sp);
    var lost = 0;
    for (var i = 0; i < res.casualties; i++) {
      target.models -= 1; lost++;
      if (target.models <= 0) { target.models = 0; target.alive = false; break; }
    }
    target.minModels = Math.min(target.minModels, target.models);
    if (lost) psychicBond(state, target, lost, log);
    if ((!target.alive || (status(target) === 'broken' && before !== 'broken'))) infamyPanic(state, target, log);
    if (!target.alive) {
      target.wipedOut = true;
      credit(target, atk, 'kill');
      log.push({ t: 'kill', text: target.label + ' is wiped out.' });
      return;
    }
    var after = status(target);
    if (after === 'broken') { target.brokenEver = true; credit(target, atk, 'broke'); }
    if (after !== before && after !== 'ready') {
      if (after === 'broken' && has(target, 'Expendable')) {
        target.alive = false;
        target.fled = true;                      // run off, not killed to the last man
        target.expended = true;                  // ...and not counted as a loss for victory (p. 57)
        log.push({ t: 'kill', text: target.label + ' breaks — Expendable: removed from play.' });
      } else {
        log.push({ t: after, text: target.label + ' is ' + after.toUpperCase() + ' (' + target.sp + ' SP vs Morale ' + currentMorale(target) + ').' });
      }
    }
  }

  /* ---------- vehicles and aircraft: damage, wrecks and repairs ---------- */
  // A hit on a machine: 1 bounces, 2-5 does a point, 6+ is a critical for D3 —
  // or D6 when the shot came from an Anti-tank or Anti-aircraft weapon.
  // what a scenario adds to every Damage roll against a side (Protecting the VIP: +2, p. 151)
  function dmgMod(state, a, t) {
    return state && state.scen && state.scen.hitMod && a && t ? (state.scen.hitMod(state, a, t) || 0) : 0;
  }
  function resolveDamage(target, hits, pierce, mod) {
    var out = { damage: 0, rolls: [] };
    mod = mod || 0;
    for (var i = 0; i < hits; i++) {
      var r0 = d6(), r = Math.min(6, r0 + mod), tag;
      if (r === 1) tag = 'Bounced off the armour!';
      else if (r <= 5) { tag = 'Target damaged! (1 DP)'; out.damage += 1; }
      else {
        var crit = pierce ? d6() : d3();
        tag = 'Critical hit! (' + (pierce ? 'D6 ' : 'D3 ') + crit + ' DP)';
        out.damage += crit;
      }
      out.rolls.push('D6 ' + r0 + (mod ? '+' + mod : '') + ' → ' + tag);
    }
    return out;
  }

  function applyDamage(state, t, damage, log, from) {
    t.damage = (t.damage || 0) + damage;
    if (t.damage <= t.str) {
      log.push({ t: 'note', text: t.label + ' takes ' + damage + ' damage (' + t.damage + ' of ' + t.str + ').' });
      return;
    }
    // knocked out: how badly depends on how far past its Structure it went
    var over = t.damage - t.str - 1;
    var bonus = over > 4 ? 2 : over > 2 ? 1 : 0;
    var roll = d6(), total = roll + bonus;
    t.alive = false;
    t.wipedOut = true;
    t.catastrophic = total > 5;
    // whatever became of it, a ground hull's wreck stays where it stood and blocks sight (p. 36)
    if (!isFlying(t)) t.wreckLoS = true;
    credit(t, from, 'kill');
    var crew = (t.cargo || []).slice();
    t.cargo = [];
    var how;
    if (isFlying(t)) {
      how = 'shot out of the sky';
      crew.forEach(function (u) {
        u.alive = false; u.models = 0; u.aboard = null;
        /* In a campaign a downed aircraft makes an emergency landing on a 4+ and
           "troops on-board survive, but get 5 TPs" (p. 86), so who was aboard
           which machine is recorded for the aftermath to read. */
        u.lostAboard = t.rid || t.id || true;
        log.push({ t: 'kill', text: u.label + ' goes down with the aircraft.' });
      });
      log.push({ t: 'kill', text: t.label + ' is destroyed — ' + how + '.' });
      return;
    }
    if (total <= 3) {
      how = 'Abandoned! The crew is out of the game';
      crew.forEach(function (u) {
        dropOff(state, t, u);
        addSP(u, d6());
        log.push({ t: 'note', text: u.label + ' bails out — ' + u.sp + ' SP.' });
      });
    } else if (total <= 5) {
      how = 'Vehicle on fire! The crew is lost';
      crew.forEach(function (u) {
        dropOff(state, t, u);
        var burn = shoot(state, { label: 'The burning ' + t.name, side: t.side, alive: true, models: 1, fp: 6, range: 48, rules: [], x: u.x, y: u.y, shotFrom: [], cls: 'infantry' }, u, 'basic', {});
        burn.log.forEach(function (l) { log.push(l); });
      });
    } else {
      how = 'Catastrophic explosion!';
      crew.forEach(function (u) {
        u.alive = false; u.models = 0; u.aboard = null;
        log.push({ t: 'kill', text: u.label + ' is destroyed inside the wreck.' });
      });
    }
    log.push({
      t: 'kill',
      text: t.label + ' is knocked out — D6 ' + roll + (bonus ? ' +' + bonus + ' overkill' : '') + ': ' + how,
      math: t.damage + ' damage against Structure ' + t.str
    });
    // only a catastrophic explosion catches the troops around the wreck (p. 36)
    if (total <= 5) return;
    var fp = 3 + t.tier;
    state.units.forEach(function (u) {
      if (!u.alive || u === t || isFlying(u) || u.aboard) return;
      if (unitDist(u, t) > 4) return;
      var blast = shoot(state, { label: 'The exploding ' + t.name, side: t.side === 'A' ? 'B' : 'A', alive: true, models: 1, fp: fp, range: 48, rules: [], x: t.x, y: t.y, shotFrom: [], cls: 'infantry' }, u, 'basic', {});
      blast.log.forEach(function (l) { log.push(l); });
    });
  }

  // put a passenger back on the table, as close to the vehicle as will fit
  function dropOff(state, veh, u) {
    u.aboard = null;
    for (var t = 0; t < 60; t++) {
      var ang = Math.random() * Math.PI * 2, d = 2 * UNIT_R + Math.random() * 2;
      var p = clampBoard({ x: veh.x + Math.cos(ang) * d, y: veh.y + Math.sin(ang) * d });
      if (TERRAIN[terrainAt(state, p.x, p.y)].impassable) continue;
      if (unitNear(state, p.x, p.y, u, 0.2)) continue;
      u.x = p.x; u.y = p.y;
      return true;
    }
    u.x = veh.x; u.y = veh.y;
    return false;
  }

  // Rally phase: a machine patches itself up. Jammers make it harder.
  function repair(state, u) {
    if (!u.damage) return null;
    // Nanobots (p. 89): the repair rolls dice for the whole Structure, not for what is left of it
    var dice = campFlag(u, 'nanobots') ? u.str : Math.max(1, u.str - u.damage), need = jammedNearby(state, u) ? 5 : 4;
    var rolls = [], fixed = 0;
    for (var i = 0; i < dice; i++) {
      var r = d6();
      rolls.push({ value: r, ok: r >= need });
      if (r >= need) fixed++;
    }
    var before = u.damage;
    u.damage = Math.max(0, u.damage - fixed);
    return {
      dice: dice, need: need, rolls: rolls, fixed: fixed, before: before, after: u.damage,
      text: u.label + ' repairs: ' + dice + 'D6 [' + rolls.map(function (r) { return r.value; }).join(' ') +
        '] on ' + need + '+ — ' + fixed + ' damage cleared (' + before + ' → ' + u.damage + ').'
    };
  }
  /* Jammers: enemies within 24" rally — and repair — on 5+ instead of 4+.
     Counter-jamming within 6" of the victim shuts that out again. */
  /* Jammers is a penalty, so it bites from a unit that is suppressed or broken;
     Counter-jamming is a bonus, so it does not (p. 28). */
  function jammedNearby(state, u) {
    var jammed = false;
    for (var i = 0; i < state.units.length; i++) {
      var e = state.units[i];
      if (!e.alive || e.aboard || e.reserve || e.x < 0) continue;
      if (e.side !== u.side && has(e, 'Jammers') && unitDist(e, u) <= 24) jammed = true;
      if (e.side === u.side && projects(e) && has(e, 'Counter-jamming') && unitDist(e, u) <= 6) return false;
    }
    return jammed;
  }

  /* Hackers (p. 57): reach into an enemy drone within 24".
     1-2 nothing, 3-4 it is locked out for the turn and takes D3+1 hits,
     5-6 it is turned on its own side first, then takes the same hits. */
  function canHack(state, a, t) {
    if (!a.alive || !t.alive || a.side === t.side) return false;
    if (!has(a, 'Hackers') || !t.drone) return false;
    if (a.hackUsed) return false;
    return unitDist(a, t) <= 24;
  }

  function hack(state, a, t, fireBack) {
    var log = [], roll = d6();
    // a Xenotripod turret's systems are alien: a 5-6 only ever locks it out (p. 130)
    if (roll >= 5 && hasOwn(t, 'Turret')) {
      log.push({ t: 'note', text: 'Turret — the alien code will not turn: D6 ' + roll + ' counts as ' + (roll - 2) + '.' });
      roll -= 2;
    }
    a.hackUsed = true;
    var turned = false, locked = false;
    if (roll <= 2) {
      log.push({ t: 'note', text: a.label + ' tries to break into ' + t.label + ' — D6 ' + roll + ': the ice holds.' });
      return { log: log, roll: roll, turned: false, locked: false };
    }
    var hits = d3() + 1;

  function collars(state) {

      u.alive = false; u.fled = true; u.expended = true;

  /* Command Vehicle (p. 56): a Command Unit riding inside lends the hull all of

    for (var i = 0; i < cargo.length; i++) if (has(cargo[i], 'Command Unit')) return cargo[i];
    return null;

  /* ---------- transport ---------- */
  function canEmbark(state, veh, u) {
    if (!veh.transport || !u.alive || u.side !== veh.side) return false;
    /* A Lifter is a flying crane: it picks up a single vehicle — with whatever is
       already riding inside it — and never infantry (p. 94). Every other hull is
       the other way round. */
    if (hasOwn(veh, 'Lifter')) {
      if (u.cls !== 'vehicle') return false;
      if (u.aboard || (veh.cargo || []).length >= veh.transport) return false;
      if (u.disembarked) return false;
      // a hull towing an emplaced gun cannot be lifted (p. 94)
      if ((u.cargo || []).some(function (c) { return hasOwn(c, 'Stationary Artillery'); })) return false;
      return unitDist(veh, u) <= 4;
    }
    if (isMachine(u)) return false;
    // a Rapid insertion platform is loaded before the battle and never again (p. 79)
    if (hasOwn(veh, 'Immobile')) return false;
    // Riders never ride in anything: the mounts do not fit (p. 94) — bar a motorbike (Appendix 3)
    if (hasOwn(u, 'Riders') && !(mountOf(u) && mountOf(u).transport)) return false;
    /* An emplaced gun is towed rather than carried, and a hull with a gun on the
       hook has no room for troops (p. 94). */

    if (towing) return false;
    if (hasOwn(u, 'Stationary Artillery') && (veh.cargo || []).length) return false;
    if (u.aboard || (veh.cargo || []).length >= veh.transport) return false;
    if (status(u) !== 'ready') return false;            // shaken troops will not board

    veh.cargo.push(u);
    u.aboard = veh.id;
    u.boarded = true;                                   // "no single unit can be unloaded and loaded in the same turn" (p. 36)
    u.sp = 0;                                           // safe inside, and steadied
    u.x = -1; u.y = -1;

  function disembark(state, veh, u, pos) {

    veh.cargo.splice(i, 1);
    u.aboard = null;
    u.disembarked = true;
    if (pos && !TERRAIN[terrainAt(state, pos.x, pos.y)].impassable
      && !unitNear(state, pos.x, pos.y, u, 0.2) && unitDist({ x: pos.x, y: pos.y }, veh) <= 4) {
      u.x = pos.x; u.y = pos.y;

  /* ---------- destructible terrain (pp. 41-43, 57-58) ----------
     Low walls, high walls and ordinary buildings can be brought down; reinforced

     sight and barring the ground, and whoever was inside has to get out. */

      /* plunging fire: the low wall a target shelters by (within 2") is its cover

      if (r2.kind === 'barricade' && has(attacker, 'Indirect Fire') &&

    if (has(u, 'Cumbersome Weapon')) return false;
    if (has(u, 'Sappers')) return true;
    return destructibleKind(r) === 'target';

  function destroyTerrain(state, r, log, by) {
    var kind = destructibleKind(r);

    r.wrecked = true;
    var out = { piece: r, was: was, kind: r.kind, evicted: [] };

  /* Shooting a piece down on its own (p. 57): a final 15+, or an unmodified 9. */
  function shootTerrain(state, a, r) {

    var sb = sizeBonus(a.models);

  /* Terrorist (Path of the Villain, p. 112). A piece of terrain was mined before

      t: 'shoot',
      text: a.label + ' sets off the charge under the ' + TERRAIN[r.kind].name.toLowerCase() + '.',
      math: parts.map(fmtPart).join(', ') + ' = ' + total + ' — needs 15+, or an unmodified 9 → ' +

    if (sb) { total += sb; parts.push({ label: a.models + ' models', v: sb }); }
    var bonus = chargeBonus(a, r);

    var down = roll === 9 || total >= 15;

      t: 'assault',
      text: a.label + ' sets charges against the ' + TERRAIN[r.kind].name.toLowerCase(),

  /* A Tier III-V vehicle simply drives through a low or high wall (p. 35). */

  /* ---------- shooting ---------- */

      for (var k = 0; k < 16; k++) {

        var x = to.x + Math.cos(ang) * ring, y = to.y + Math.sin(ang) * ring;

    if (!best) return { ok: false, text: 'There is no room at ' + to.label + ' — ' + u.label + ' stays where it is.' };

  function dugIn(u) { return !!(u && u.dugIn && hasOwn(u, 'Stationary Artillery')); }

  function canShoot(state, a, t, mode, opts) {
    opts = opts || {};

    /* Only what is on the table can be shot at. A unit held in reserve is parked
       just off the table's corner at (-1, -1), and a unit riding inside a hull is
       not there at all; neither is a target, however close the numbers say. */
    if (t.reserve || t.aboard || t.x < 0 || t.y < 0) return false;
    if (!opts.aux) {
      // a main weapon set up for one kind of target cannot engage the other

  /* A live Markerlight call (p. 58). The mark is not a condition the target wears

      isFlying(a) || isFlying(t) ||                    // aircraft shoot, and are shot at, basic

  /* ---------- NOT ONE STEP BACKWARDS! (T5, p. 87) ----------

    var log = [{
      t: 'shoot', text: a.label + ' fires over the heads of ' + t.label + ' — NOT ONE STEP BACKWARDS!',

  /* ---------- assault ---------- */

  /* A boulder: an irregular footprint raised into a lumpy block, each facet

  var BASALTS = ['#0c0a09', '#161311', '#211c19', '#2e2723', '#3d3530', '#4c423b'];

    var S = pal || STONE;

  /* A run of ruined masonry: the wall broken down into short sections of

  function drawProp(g, pr, lift, cutaway) {

    var x0 = r.x + inset, y0 = r.y + inset, x1 = r.x + r.w - inset, y1 = r.y + r.h - inset;

      if (d < w) { wx = x0 + d; wy = y0; }                                   // the north wall
      else if (d < w + h) { wx = x1; wy = y0 + (d - w); }                    // the east
      else if (d < 2 * w + h) { wx = x1 - (d - w - h); wy = y1; }           // the south
      else { wx = x0; wy = y1 - (d - 2 * w - h); }                           // the west
      var q = toScreen(wx, wy);

    /* ================= bipedal walkers ================= */
    /* A walker is not a tank on legs: it is an upright machine that stands on two
       of them, with the crew in a cockpit head and the guns on its shoulders. */
    /* Walkers come in three weights, read off the size of the hull they
       replace: a light one is a slim humanoid, a wedge of chest over long thin
       legs with a finned head and a small gun on each forearm; a medium one is
       a rounded egg of a body with the cockpit glazed into its chest, heat
       sinks on its back and gun pods on its forearms; a heavy one is a hunched
       battle mech, a huge chest with its head sunk into it, missile boxes on
       its shoulders and blocky arms hanging low. */
    /* A walker is drawn a size down from the hull it stands in for: on legs
       the same footprint towered over everything near it. */
    var MS = null;
    function msInit() {
      var MECH = 0.8;
      MS = { len: spec.len * MECH, wid: spec.wid * MECH, hgt: spec.hgt * MECH, gun: (spec.gun || spec.fixedGun || spec.len * 0.9) * MECH };
    }
    function mechClass() {
      var base = HULL[u.art] || HULL.wheeled;
      // light tanks and cars under 2.3", the big future hulls from 2.55"
      return base.len < 2.3 ? 'light' : base.len >= 2.55 ? 'heavy' : 'medium';
    }
    /* legH: ground to hip; torsoH: hip to the top of the body; headH: what
       stands on top of that (a light mech's head and fin, a medium's crest
       and heat sinks, a heavy's missile boxes). headroom() repeats these. */
    function mechHeights() {
      if (!MS) msInit();
      var sf = MS.len / 2.0, cls = mechClass();
      if (cls === 'light') {
        return { legH: Math.round(30 * sf + MS.hgt * 0.4), torsoH: Math.round(13 * sf + MS.hgt * 0.3), headH: Math.round(12 * sf), sf: sf, cls: cls };
      }
      if (cls === 'heavy') {
        return { legH: Math.round(28 * sf + MS.hgt * 0.45), torsoH: Math.round(30 * sf + MS.hgt * 0.55), headH: Math.round(9 * sf), sf: sf, cls: cls };
      }
      return { legH: Math.round(26 * sf + MS.hgt * 0.45), torsoH: Math.round(26 * sf + MS.hgt * 0.5), headH: Math.round(7 * sf), sf: sf, cls: 'medium' };
    }

    /* What a walker carries is what the hull it stands in for carries: a tank's
       gun on the arm, an AA hull's twin cannon, a support hull's rockets on
       the shoulders, a plasma cannon, a flame projector; an ambulance carries
       nothing but its cross. */
    /* An arm carries what the unit's weapon table says it fires, so the barrel
       a shot comes out of is the barrel that looks like it fires it: the rail
       gun's thin blue line off the rail barrel, shells off the cannon. Each of
       these registers the muzzle mount that its style asks for. */
    function mechKit() {
      var st = spec.style, k = { main: 'cannon', off: 'mg', shoulder: null };
      /* What it actually carries comes first; the hull's own style only decides
         what hangs off the shoulders. */
      var spec2 = root.PMC && root.PMC.weaponSpec ? root.PMC.weaponSpec(u) : null;
      if (spec2 && ARM_FOR[spec2.p]) {
        /* Rockets lobbed in salvoes are a battery, not something a machine
           holds: they ride on the shoulder, where the hull carries its rack,
           and the arm takes whatever else it has. */
        var shoulderGun = SHOULDER_STYLE[spec2.p] || null;
        k.main = shoulderGun
          ? (spec2.s && ARM_FOR[spec2.s] !== 'rocket' ? ARM_FOR[spec2.s] : 'cannon')
          : ARM_FOR[spec2.p];
        k.off = spec2.s ? (ARM_FOR[spec2.s] || 'mg') : (k.main === 'mg' ? 'none' : 'mg');
        if (shoulderGun) { k.shoulder = shoulderGun; return k; }
        if (st) {
          k.shoulder = st.tMissiles || st.turret === 'mbt' || st.turret === 'future' ? 'missile'
            : st.mrl || st.mlrs || st.turret === 'calliope' ? 'rocket'
              : st.dish || st.turret === 'dish' ? 'dish'
                : st.turret === 'flamer' ? 'tanks'
                  : st.turret === 'recon' || st.cross ? 'aerials' : null;
        } else if (spec.dish) k.shoulder = 'dish';
        // a launcher on both an arm and the shoulder is one launcher too many
        if (k.shoulder === k.off || k.shoulder === k.main) k.shoulder = null;
        return k;
      }
      if (!st) {
        k.main = spec.twin ? 'twinauto' : spec.fat ? 'howitzer' : spec.elev ? 'rocket' : 'cannon';
        k.off = spec.drum ? 'flame' : 'missile';
        if (spec.dish) k.shoulder = 'dish';
        return k;
      }
      if (st.plasma) { var pk = { main: 'plasma', off: st.turret === 'future' ? 'rail' : st.tMissiles ? 'missile' : 'mg', shoulder: st.turret === 'future' || st.tMissiles ? 'missile' : null }; return pk; }
      switch (st.turret) {
        case 'light': k.main = st.gunLen >= 2 ? 'long' : 'cannon'; if (st.tMissiles) k.off = 'missile'; break;
        case 'howitzer': k.main = 'howitzer'; break;
        case 'recon': k.main = 'auto'; k.shoulder = 'aerials'; break;
        case 'mbt': k.main = st.gunLen >= 2.4 ? 'long' : 'cannon'; k.shoulder = 'missile'; if (st.tMissiles) k.off = 'missile'; break;
        case 'future': k.main = 'long'; k.off = 'rail'; k.shoulder = 'missile'; break;
        case 'plasma': k.main = 'plasma'; break;
        case 'flamer': k.main = 'flame'; k.shoulder = 'tanks'; break;
        case 'ifv': k.main = 'auto'; k.off = 'missile'; break;
        case 'aa': k.main = 'twinauto'; k.off = 'twinauto'; k.shoulder = st.noMissiles ? 'dish' : 'missile'; break;
        case 'dish': k.main = 'mg'; k.off = 'none'; k.shoulder = 'dish'; break;
        case 'calliope': k.main = 'cannon'; k.shoulder = 'rocket'; break;
        case 'arty': k.main = 'howitzer'; break;
        case 'mg': k.main = 'mg'; break;
        case 'missile': k.main = 'missile'; break;
        default:
          if (st.casemate) { k.main = st.casemate.w > 4 ? 'howitzer' : 'long'; k.off = st.casemate.missiles ? 'missile' : 'mg'; }
          else if (st.mrl || st.mlrs) { k.main = 'rocket'; k.shoulder = 'rocket'; }
          else if (st.bedGun) { k.main = st.bedGun === 'auto' ? 'auto' : 'mg'; k.off = st.bedRack ? 'rocket' : 'mg'; }
          else if (st.cross) { k.main = 'none'; k.off = 'none'; k.shoulder = 'aerials'; }
          else if (st.pintle || st.rws) { k.main = 'mg'; k.off = 'none'; if (st.aerials) k.shoulder = 'aerials'; }

    // one weapon, laid along a frame from a0 at height z, reaching `reach`

        case 'cannon': return barrel(fr, a0, reach, b, z, 2.6 * sc, 'gun', { brake: true, fume: 0.5 });
        case 'long': return barrel(fr, a0, reach * 1.2, b, z, 2.3 * sc, 'gun', { brake: true, fume: 0.45 });
        // a combat walker's main gun: a heavy cannon held level, long and thick, braked at the muzzle
        case 'bigcannon': return barrel(fr, a0, reach * 1.15, b, z, 3.4 * sc, 'gun', { brake: true, fume: 0.55 });
        case 'howitzer': return barrel(fr, a0, reach * 0.8, b, z, 4.6 * sc, 'gun', { brake: true, up: 3 });
        case 'plasma': {
          var pw = 4 * sc, tip = barrel(fr, a0, reach * 0.95, b, z, pw, 'gun', { col: '#1c2129' });
          vents(fr, a0, reach * 0.95, b, z, pw, 3);
          if (!dead) sEllipse(tip[0], tip[1], pw * 0.4, pw * 0.36, 'rgba(180,245,255,.95)');
          return tip;
        }
        case 'flame': {
          var ft = barrel(fr, a0, reach * 0.55, b, z, 3.8 * sc, 'flame', { col: '#3a3f38', lit: '#5c6458' });
          if (!dead) { sEllipse(ft[0], ft[1], 1.5 * sc, 1.3 * sc, '#e08a3a'); sEllipse(ft[0], ft[1], 0.8, 0.7, '#ffd070'); }

        case 'auto': return barrel(fr, a0, reach * 0.95, b, z, 1.5 * sc, 'auto', { brake: true });
        case 'twinauto':
          barrel(fr, a0, reach * 0.9, b - wd * 0.5, z, 1.3 * sc, 'auto', { brake: true });
          return barrel(fr, a0, reach * 0.9, b + wd * 0.5, z, 1.3 * sc, 'auto', { brake: true });

          var rw = 2.4 * sc, rt = barrel(fr, a0, reach, b, z, rw, 'rail', { col: '#141b22', lit: '#2a313b' });
          vents(fr, a0, reach, b, z, rw, 3);

          return launcher(fr, a0 - 0.12, a0 + 0.22, b - wd * 1.2, b + wd * 1.2, z - 2, 7 * sc, 3, 3, 'rocket', { tone: TT, warheads: '#8a3a24', up: 2 });

    function drawMech() {
      var hm = mechHeights(), cls = hm.cls, KITM = mechKit(), sf = hm.sf;
      var heavy = cls === 'heavy', light = cls === 'light';
      var hipY = lift + hm.legH;                       // where the legs meet the body
      var shoulder = hipY + hm.torsoH;                 // the top of the torso
      var waistY = hipY + Math.round(3 * sf);          // where the chest starts
      // the torso's half-depth and half-width
      var tL = MS.len * (heavy ? 0.22 : light ? 0.13 : 0.2);
      var tW = MS.wid * (heavy ? 0.42 : light ? 0.26 : 0.42);
      var TF = frameAt(0, 0, AIM);                     // the body turns to its target
      var ca = Math.cos(AIM), sa = Math.sin(AIM);
      var fwd = ca + sa;                               // > 0: the chest is toward the viewer
      function nearOf(s) { return s * (ca - sa); }     // > 0: that side is toward the viewer

      // the shadow the machine casts is its feet, not a hull-sized slab

      poly(g, fpr, 'rgba(14,11,8,.34)');

      /* Legs stride: one forward, one back, so the pair reads in three quarters.

      var swing = opts.walk ? (opts.walk % 2 ? 1 : -1) : 1;

      var legSpread = tW * (heavy ? 0.6 : light ? 0.7 : 0.58);
      legs2.forEach(function (L) {

      });
      legs2.sort(function (p, q) { return p.d - q.d; });

      armsBack.forEach(drawArm);
      drawLeg(legs2[0]);
      drawLeg(legs2[1]);
      drawTorso();
      armsFront.forEach(drawArm);
      drawTop();
      drawDamage();

      // a sensor light or a hot muzzle: a small orange dot, out when dead
      function glow(p, r) {

        sEllipse(p[0], p[1], r, r * 0.85, '#ff8a2a');
        sEllipse(p[0] - r * 0.2, p[1] - r * 0.2, r * 0.45, r * 0.4, '#ffd68a');

      /* Cockpit glass and sensor lenses: a glassy blue, bright at the top where

      // a round lens of the same glass, with a highlight

        if (dead) { sEllipse(p[0], p[1], r, r * 0.85, GLASS); return; }
        sEllipse(p[0], p[1], r * 2, r * 1.7, 'rgba(92,192,236,.22)');
        sEllipse(p[0], p[1], r, r * 0.85, '#2b86c4');
        sEllipse(p[0] + r * 0.1, p[1] + r * 0.15, r * 0.6, r * 0.5, '#1a5a8c');
        sEllipse(p[0] - r * 0.3, p[1] - r * 0.3, r * 0.4, r * 0.34, '#d6f6ff');

      // an outline with its corners cut: a plate that reads as rounded

      /* ---- legs ---- */
      /* Hip, a knee bent a little forward, an ankle, a foot. A heavy leg is

      function drawLeg(L) {

                  lift, Math.round(3 * sf), TS, null, [[ankT + fl * 0.6, c1 - fw * 0.08], [ankT + fl * 0.6, c1 + fw * 0.08], [ankT + fl * 0.3, c0 + fw * 0.16], [ankT + fl * 0.3, c0 - fw * 0.16]]);

      /* ---- the body ---- */
      function drawTorso() {

         over a waist that tapers into a skirt of plates about the hips. The
         head is sunk in it: all that shows is a visor slot high on the front. */
      function heavyTorso() {
        slabF(TF, -tL * 0.45, tL * 0.45, -tW * 0.45, tW * 0.45, hipY - 4, Math.round(7 * sf), TS);

            if (nearOf(s) <= 0) return;

          [-1, 1].forEach(function (s) {
            var e0 = S3(TF(-tL * 1.02, s * tW * 0.62), zU + upH * 0.65), e1 = S3(TF(-tL * 1.02, s * tW * 0.62), shoulder + 4);

<script>/* PMC 2670 — the Unit Atlas.

       main,         // where the sheets go
       colours,      // a row for the colour swatches (optional)
       toggles,      // the Show buttons, each with data-t="states|facings|props|wrecks"
       search,       // an input to filter by (optional)

    function render() {
      var many = shown().length > 1;
      main.innerHTML = shown().map(function (f) {
        return (many ? '<h2 class="faction" id="f-' + f.id + '">' + f.name + '</h2>' : '') + f.groups.map(function (g) {
          var cards = g.units.filter(isCompact).slice().sort(function (a, b) { return a.tier - b.tier; });
          var full = g.units.filter(function (p) { return !isCompact(p); });
          return '<section data-group><h3 class="group">' + esc(g.name) + '</h3>' +
            (cards.length ? '<div class="cards">' + cards.map(compact).join('') + '</div>' : '') +
            full.map(article).join('') + '</section>';
        }).join('');
      }).join('') + '<p class="empty" data-none hidden>No unit matches that search.</p>';
      (o.indexes || []).forEach(function (n) { n.innerHTML = indexHtml(); });
      if (io) io.disconnect();
      var tiles = Array.prototype.slice.call(main.querySelectorAll('canvas.tile'));
      io = 'IntersectionObserver' in root ? new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting && e.target.dataset.drawn !== colour) draw(e.target); });
      }, { root: o.scroller || null, rootMargin: '400px 0px' }) : null;
      if (io) tiles.forEach(function (c) { io.observe(c); }); else tiles.forEach(draw);
      filter();
    }

    // ---- drawing, only as tiles come into view ----
    function draw(cv) {
      var p = byKey[cv.dataset.key];
      var dpr = Math.min(2, root.devicePixelRatio || 1);
      var W = cv.clientWidth || 132, H = cv.clientHeight || 112;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      var g = cv.getContext('2d');
      g.clearRect(0, 0, cv.width, cv.height);
      var face = cv.dataset.face != null ? faceAngle(+cv.dataset.face) : faceAngle(1);
      var u = Object.assign({}, p, {
        id: 'G' + p.key, side: 'A', facing: face, alive: true, damage: 0, sp: 0, cargo: [],
        rules: (p.rules || []).slice(), models: p.size, x: 10, y: 10
      });
      if (p.cls === 'vehicle' && p.faction !== 'bugs' && p.faction !== 'xeno') R.applyPropulsion(u, cv.dataset.prop || defaultProp(p));
      if (cv.dataset.riders) R.applyRiders(u, true);
      if (cv.dataset.mount) u.mount = cv.dataset.mount;
      var mach = machine(p);
      var walker = cv.dataset.prop === 'walker';
      // a tile drawn narrower than the width it was framed for (o.fit) shrinks its figure to match, rather than cropping it
      var ref = o.fit && (cv.classList.contains('inf') ? o.fit.inf : o.fit.other), k = ref ? Math.min(1, W / ref) : 1;
      var mag = k * (mach ? (p.faction === 'bugs' ? 0.72 : p.faction === 'xeno' && p.cls === 'vehicle' ? 1.3 : p.cls === 'aircraft' ? 1.0 : walker ? 1.05 : 1.15) : 1.55);
      var ground = H - k * (mach ? (p.faction === 'bugs' ? 18 : walker || p.cls === 'aircraft' ? 14 : 26) : 16);
      var s0 = I.toScreen(10, 10);
      // the atlas draws as the first side, in its colour (repainting a side throws its baked figures away, so only on a change)
      if (I.PALETTE.A !== I.COLOURS[colour]) I.setSideColour('A', colour);
      try {
        if (cv.dataset.status === 'wrecked') {
          // a wreck sits on the ground, so it is framed like a ground vehicle and has headroom for its smoke
          u.alive = false;
          var gw = H - 30 * k;
          g.setTransform(mag * dpr, 0, 0, mag * dpr, (W / 2 - s0.x * mag) * dpr, (gw - s0.y * mag) * dpr);
          I.drawWreck(g, u, { x: 10, y: 10 }, 0, 1700);
        } else {
          g.setTransform(mag * dpr, 0, 0, mag * dpr, (W / 2 - s0.x * mag) * dpr, (ground - s0.y * mag) * dpr);
          I.drawUnit(g, u, { at: { x: 10, y: 10 }, lift: 0, status: cv.dataset.status || 'ready', morale: 0 });
        }
      } catch (e) { if (root.console) console.error(p.key, e); }
      g.setTransform(1, 0, 0, 1, 0, 0);
      cv.dataset.drawn = colour;
    }

    // ---- colours: every company colour the game offers ----
    var sw = o.colours;
    function drawSwatches() {
      if (!sw) return;
      sw.innerHTML = I.COLOUR_KEYS.map(function (k) {
        var c = I.COLOURS[k];
        return '<button type="button" data-c="' + k + '" title="' + esc(c.name) + '" aria-pressed="' + (k === colour) + '"><i style="background:' + c.mid + '"></i>' + esc(c.name) + '</button>';
      }).join('');
    }
    function setColour(k) {
      if (!I.COLOURS[k]) return;
      colour = k;
      drawSwatches();
      Array.prototype.forEach.call(main.querySelectorAll('canvas.tile'), function (c) {
        var r = c.getBoundingClientRect();
        if (r.bottom > -400 && r.top < innerHeight + 400) draw(c); else c.dataset.drawn = '';
      });
    }
    if (sw) {
      drawSwatches();
      sw.addEventListener('click', function (e) {
        var b = e.target.closest('[data-c]'); if (!b) return;
        setColour(b.dataset.c);
        if (o.onColour) o.onColour(colour);
      });
    }

    // ---- the toggles ----
    if (o.toggles) {
      o.toggles.addEventListener('click', function (e) {
        var b = e.target.closest('[data-t]'); if (!b) return;
        var k = b.dataset.t;
        show[k] = !show[k];
        b.setAttribute('aria-pressed', String(show[k]));
        render();
      });
    }

    // ---- a unit's sheet, clicked ----
    if (o.onPick) {
      main.addEventListener('click', function (e) {
        var u = e.target.closest('.unit[data-k]');
        if (u) o.onPick(u.dataset.k);
      });
    }

    // ---- search ----
    function filter() {
      var q = o.search ? o.search.value.trim().toLowerCase() : '', any = false;
      /* The words as a phrase first ("machine gun"); failing that, a unit has
         to answer to every one of them on its own ("sappers insertion"). */
      var cards = main.querySelectorAll('.unit[data-find]');
      var terms = q ? q.split(/[\s,]+/).filter(Boolean) : [];
      var phrase = terms.length > 1 && Array.prototype.some.call(cards, function (a) { return a.dataset.find.indexOf(q) >= 0; });
      Array.prototype.forEach.call(cards, function (a) {
        var f = a.dataset.find;
        var hit = !terms.length || (phrase ? f.indexOf(q) >= 0 : terms.every(function (t) { return f.indexOf(t) >= 0; }));
        a.hidden = !hit; if (hit) any = true;
      });
      Array.prototype.forEach.call(main.querySelectorAll('section[data-group]'), function (s) {
        s.hidden = !s.querySelector('.unit:not([hidden])');
      });
      (o.indexes || []).forEach(function (n) {
        Array.prototype.forEach.call(n.querySelectorAll('li'), function (li) {
          var a = main.querySelector('#' + PFX + li.dataset.k);
          li.hidden = a ? a.hidden : false;
        });
      });
      var none = main.querySelector('[data-none]');
      if (none) none.hidden = any;
    }
    if (o.search) o.search.addEventListener('input', filter);

    function scrollTo(key) {
      var a = main.querySelector('#' + PFX + key);
      if (a) a.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    render();
    return { render: render, filter: filter, setColour: setColour, scrollTo: scrollTo };
  }

  root.PMCAtlas = { mount: mount };
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
PMCAtlas.mount({
  main: document.getElementById('main'),
  colours: document.getElementById('colours'),
  toggles: document.getElementById('toggles'),
  search: document.getElementById('q'),
  indexes: [document.getElementById('index'), document.getElementById('index-m')]
});
</script>
