# One-off, read-only look at the Pi (memory, swap, processor, Node, the service);
# removed again once read.
name: pi-check
on:
  push:
    branches: [claude/ci-art-test-passes-sgk5yx]
    paths: [.github/workflows/pi-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, pi]
    timeout-minutes: 5
    steps:
      - name: Look
        run: |
          echo "::notice title=machine::$(uname -m) $(nproc) cpus, node $(node -v 2>/dev/null), $(grep -m1 'Model' /proc/cpuinfo | cut -d: -f2)"
          echo "::notice title=memory::$(free -m | awk '/Mem:/{print "RAM "$2"MB total, "$7"MB available"} /Swap:/{print "; swap "$2"MB total, "$3"MB used"}' | tr -d '\n')"
          echo "::notice title=uptime::$(uptime)"
          echo "::notice title=service::$(systemctl is-active pmc-firefight) / deployed $(cat /opt/pmc-firefight/app/deployed.txt 2>/dev/null) / better-sqlite3 $(test -d /opt/pmc-firefight/app/node_modules/better-sqlite3 && echo present || echo missing) / health $(curl -fsS -m 3 http://localhost:8787/health 2>&1 | head -c 80)"
          echo "::notice title=oom::$(journalctl -k --since '-24h' --no-pager 2>/dev/null | grep -ci 'out of memory\|oom-kill') kernel OOM lines in 24h; tools: $(command -v g++ >/dev/null && echo g++ ok || echo no g++), $(command -v python3 >/dev/null && echo python3 ok || echo no python3)"
          free -m; swapon --show; df -h /opt
