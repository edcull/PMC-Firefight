# Every push and pull request: the unit tests (with the lint), the build, and
# the art snapshots (every unit and terrain picture, against its fingerprint).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save eslint@9 terser@5
      - run: npm test
      - run: npm run build
  # The art fingerprints were taken with Chromium 1194, the build Playwright
  # 1.56.1 installs (pinned in package.json for that reason); every picture
  # draws the same in it headless here, so a changed picture fails the build.
  # After changing art on purpose, re-take them: node test/browser/artsnap.js --update
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/browser/artsnap.js
      - run: node test/browser/terrainsnap.js
