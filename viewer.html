<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMC 2670 — Unit viewer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #0d1117;
    --panel: #141a24;
    --panel-2: #1a2230;
    --panel-3: #212b3b;
    --line: #26303f;
    --ink: #e7ecf4;
    --ink-dim: #93a1b5;
    --ink-faint: #64728a;
    --alpha: #d8a13a;
    --good: #7ed6a0;
    --display: 'Oxanium', system-ui, sans-serif;
    --body: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    letter-spacing: .07em; text-transform: uppercase; margin: 0; white-space: nowrap;
  }
  h1 span { color: var(--alpha); }
  header p { margin: 0; font-size: 12px; color: var(--ink-faint); }
  header .keys { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  /* the way back to the game, which opens on its main menu */
  .vhome {
    align-self: center; flex: none; text-decoration: none; white-space: nowrap;
    font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; background: var(--panel-2);
  }
  .vhome:hover, .vhome:focus-visible { color: var(--ink); border-color: var(--alpha); }
  .vhome svg { width: 17px; height: 17px; display: block; }
  @media (pointer: coarse) { .vhome svg { width: 19px; height: 19px; } }
  @media (pointer: coarse) { .vhome { padding: 9px 12px; font-size: 12px; } }
  /* a phone's way into the unit list, which there is a sidebar */
  .vunits, .vclose, .vscrim { display: none; }
  .vunits {
    align-self: center; flex: none; align-items: center; cursor: pointer; white-space: nowrap;
    font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); border: 1px solid var(--alpha); border-radius: 5px; padding: 5px 10px; background: var(--panel-2);
  }
  .vclose {
    align-items: center; justify-content: center; cursor: pointer;
    width: 36px; height: 36px; margin: -8px -6px -6px 0; font-size: 20px; line-height: 1;
    background: none; border: none; color: var(--ink-dim);
  }
  @media (pointer: coarse) { .vunits { padding: 9px 12px; font-size: 12px; } }
  header kbd {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 5px; font-family: var(--mono); font-size: 10px;
  }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 12px; padding: 12px;
  }
  /* A wide screen has room for four units a row in the list and still a good
     stage in the middle; anything narrower keeps the list at two a row. */
  @media (min-width: 1700px) {
    main { grid-template-columns: 572px minmax(0, 1fr) 300px; }
  }

  .vpanel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .vpanel h3 {
    font-family: var(--display); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
    margin: 0; padding: 9px 11px 7px; border-bottom: 1px solid var(--line); flex: none;
  }
  .vscroll { overflow-y: auto; padding: 7px; min-height: 0; scrollbar-width: thin; }

  #vsearch {
    width: 100%; background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 9px; font-family: var(--body); font-size: 12.5px;
  }
  /* the tabs and the search stay put at the top; only the list under them scrolls */
  .vsearchbar { flex: none; padding: 7px 7px 6px; border-bottom: 1px solid var(--line); }
  .vlistscroll { flex: 1; overscroll-behavior: contain; }
  /* a tab for each army above the list; a search spans all four, so the tabs dim while it runs */
  .vfacs { display: flex; gap: 3px; flex: none; padding: 7px 7px 0; border-bottom: 1px solid var(--line); }
  .vfacs button {
    flex: 1; min-width: 0; background: none; border: 1px solid transparent; border-bottom: none;
    border-radius: 5px 5px 0 0; margin-bottom: -1px; padding: 7px 2px 6px; cursor: pointer; color: var(--ink-dim);
    font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .vfacs button:hover { color: var(--ink); }
  .vfacs button.on { color: var(--alpha); background: var(--panel-2); border-color: var(--line); border-bottom: 1px solid var(--panel-2); }
  .vfacs.searching button.on { color: var(--ink-dim); background: none; border-color: transparent; }
  @media (pointer: coarse) { .vfacs button { min-height: 40px; font-size: 11.5px; } }
  #vlist h4 {
    font-family: var(--display); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 10px 0 4px 3px;
  }
  #vlist h4:first-child { margin-top: 0; }
  .vu {
    display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 1px solid transparent;
    border-radius: 4px; padding: 4px 7px; color: var(--ink); cursor: pointer;
    font-family: var(--body); font-size: 12px;
  }
  .vu:hover { background: var(--panel-2); border-color: var(--line); }
  .vu.on { background: color-mix(in srgb, var(--alpha) 14%, transparent); border-color: var(--alpha); }
  .vu-code { font-family: var(--display); font-size: 10px; font-weight: 600; color: var(--ink-dim); }
  .vu.on .vu-code { color: var(--alpha); }
  .vu-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vu-w {
    grid-column: 2; font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint);
  }

  .vstage {
    background: #0c1014; border: 1px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative;
  }
  /* the stage's zoom: close on the unit by default, out to the whole line to watch it fire */
  .vzoom {
    position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; align-items: center;
    background: rgba(12, 16, 20, .72); border: 1px solid var(--line); border-radius: 6px; padding: 3px;
  }
  .vzoom button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--display); font-size: 12px; min-width: 28px; height: 26px; padding: 0 7px; cursor: pointer;
  }
  .vzoom button:hover { border-color: var(--alpha); }
  .vzoom button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  #vboard { touch-action: pan-y; }
  /* a tap on the stage fires; it does not flash the browser's tap highlight or select anything */
  #vboard, .vstage { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; outline: none; }
  #vboard {
    display: block; flex: none; min-height: 0;   /* sized by fit(), never stretched */
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  .vrow { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 3px; }
  .vrow b { font-family: var(--display); font-size: 14px; }
  .vtier { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
  .vstat { font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); margin: 0 0 7px; line-height: 1.6; }
  .vweap {
    font-size: 12px; color: var(--ink-dim); margin: 0 0 12px;
    border-left: 2px solid var(--alpha); padding-left: 9px;
  }
  /* the unit's panel: its name, two tabs, and whichever tab is open scrolling on its own */
  #vctl { display: flex; flex-direction: column; min-height: 0; flex: 1; padding: 9px 9px 0; }
  #vctl > .vrow { flex: none; padding: 0 2px; }
  .vtabs { display: flex; gap: 4px; flex: none; margin-top: 7px; border-bottom: 1px solid var(--line); }
  .vtabs button {
    flex: 1; background: none; border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0;
    color: var(--ink-dim); cursor: pointer; padding: 8px 6px 7px; margin-bottom: -1px;
    font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .vtabs button:hover { color: var(--ink); }
  .vtabs button.on { color: var(--alpha); background: var(--panel-2); border-color: var(--line); border-bottom: 1px solid var(--panel-2); }
  .vtabbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 2px 12px; scrollbar-width: thin; }
  .vtabbody[hidden] { display: none; }
  .vtabbody > .vacts:first-child { margin-top: 0; margin-bottom: 12px; }
  .vtabbody > .vrules { margin-top: 0; padding-top: 0; border-top: none; }
  /* On a desktop there is room for both at once: no tabs, the options first and
     the profile under them, the whole panel scrolling as one. */
  @media (min-width: 1001px) {
    #vctl { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-bottom: 12px; }
    #vctl .vtabs { display: none; }
    #vctl .vtabbody, #vctl .vtabbody[hidden] { display: block; flex: none; overflow: visible; padding: 10px 2px 0; }
    #vctl .vtabbody + .vtabbody { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  }
  .vgrp { margin-bottom: 11px; }
  .vgrp label {
    display: block; font-family: var(--display); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px;
  }
  .vseg { display: flex; flex-wrap: wrap; gap: 4px; }
  .vsg {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 4px; padding: 4px 9px; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px;
    /* each as wide as its word, sharing out what is left, so a row fits on one line */
    flex: 1 1 auto; min-width: 0; white-space: nowrap; text-align: center;
  }
  .vsg:hover { color: var(--ink); }
  .vsg.on { color: var(--ink); border-color: var(--alpha); background: color-mix(in srgb, var(--alpha) 14%, transparent); }
  input[type=range] { width: 100%; accent-color: var(--alpha); }
  /* as many buttons as the unit has abilities: they wrap onto further rows rather than run off the panel */
  .vacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .vacts .vbtn { flex: 1 1 auto; }
  .vbtn {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 5px; padding: 8px 6px; cursor: pointer;
    font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  .vbtn:hover { border-color: var(--alpha); }
  .vbtn.primary { border-color: color-mix(in srgb, var(--alpha) 60%, transparent); background: color-mix(in srgb, var(--alpha) 14%, transparent); }

  .vbtn[disabled] { opacity: .4; cursor: default; }
  .vbtn[disabled]:hover { border-color: var(--line); }

  /* the army's colours, one swatch each */
  .vsw { display: flex; flex-wrap: wrap; gap: 5px; }
  .vsw button {
    width: 26px; height: 26px; padding: 2px; border-radius: 5px; cursor: pointer;
    background: none; border: 1px solid var(--line);
  }
  .vsw button span { display: block; width: 100%; height: 100%; border-radius: 3px; }
  .vsw button.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .vsw button:hover { border-color: var(--ink-faint); }

  /* the unit's rules: what it carries, and every special rule with its text */
  .vrules { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .vrules > label {
    display: block; font-family: var(--display); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 7px;
  }
  .vrule { margin: 0 0 8px; font-size: 12px; line-height: 1.45; color: var(--ink-dim); }
  .vrule b {
    display: inline-block; color: var(--ink); font-weight: 600;
    border-bottom: 1px dotted var(--ink-faint);
  }
  .vrule p { margin: 2px 0 0; }
  .vtable { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; margin-bottom: 10px; }
  .vtable th, .vtable td { padding: 3px 4px; text-align: center; border: 1px solid var(--line); }
  .vtable th { color: var(--ink-faint); font-weight: 500; font-size: 9.5px; letter-spacing: .05em; }
  .vtable td { color: var(--ink); }

  /* the tooltip layer (tips.js), as the game styles it */
  .tip {
    position: fixed; z-index: 400; max-width: min(280px, calc(100vw - 16px));
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    padding: 8px 11px 9px; pointer-events: none;
    font-size: 12.5px; line-height: 1.45;
    opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s;
  }
  .tip.on { opacity: 1; transform: none; }
  .tip.tip-below { transform: translateY(-3px); }
  .tip.tip-below.on { transform: none; }
  .tip b {
    display: block; font-family: var(--display); font-size: 11px;
    letter-spacing: .07em; text-transform: uppercase; color: var(--alpha); margin-bottom: 3px;
  }
  .tip span { display: block; color: var(--ink-dim); }
  [data-tip] { cursor: help; }

  :focus-visible { outline: 2px solid var(--alpha); outline-offset: 2px; }
  #vboard { width: 100%; }

  /* A phone, a tablet held upright, or a phone asking for the desktop site:
     one column that scrolls as a page. The stage comes first and stays pinned
     to the top while the controls scroll under it, so Fire and Walk can be
     watched as they are pressed; then the unit's controls, then the list to
     pick from, and picking scrolls back up. (The three-column layout needs
     more than 1000px; the old two-row layout between 700 and 1000 let the
     canvas grow past its stage, and the unit was drawn out of sight.) */
  @media (max-width: 1000px) {
    /* an app, not a page: nothing under the header scrolls but the open tab
       (and the unit sidebar), with the stage fixed at the top */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; }
    main { flex: 1; min-height: 0; overflow: hidden; }
    header { padding: 9px 16px; }
    header p, header .keys { display: none; }
    /* one line: the way back, then the title, cut short rather than wrapped */
    header { flex-wrap: nowrap; align-items: center; }
    h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    main { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 16px; }
    .vstage { order: 1; flex: none; height: 40vh; min-height: 230px; max-height: 360px; }
    .vctlpanel { order: 2; flex: 1; min-height: 0; }
    /* on a phone the tiles come down a size, two infantry cards to a row */
    .atl canvas.tile { width: 116px; height: 99px; }
    .atl canvas.tile.tall { height: 132px; }
    .atl canvas.tile.inf { width: 128px; height: 101px; }
    .atl .row { grid-template-columns: 60px repeat(8, 116px); }
    /* the unit list: a sidebar that slides in from the right, under its button, over the stage — and away again once a unit is picked */
    .vside {
      position: fixed; top: 0; bottom: 0; right: 0; left: auto; z-index: 50;
      width: min(340px, 86vw); border-radius: 6px 0 0 6px; border-right: none;
      transform: translateX(102%); transition: transform .22s ease-out; visibility: hidden;
      box-shadow: -10px 0 28px rgba(0, 0, 0, .5);
      padding-bottom: env(safe-area-inset-bottom);
    }
    body.vside-open .vside { transform: none; visibility: visible; }
    .vside h3 { display: flex; align-items: center; justify-content: space-between; padding-top: max(9px, env(safe-area-inset-top)); }
    .vscrim {
      position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .5);
      opacity: 0; pointer-events: none; transition: opacity .22s;
    }
    body.vside-open .vscrim { opacity: 1; pointer-events: auto; }
    .vunits, .vclose { display: inline-flex; }
    /* the way back on the left, the title, and the unit list's button at the right */
    header > .vhome { order: 1; }
    header > h1 { order: 2; }
    header > .vunits { order: 3; margin-left: auto; }
    .vscrim { display: block; }
    .vbtn { padding: 11px 6px; font-size: 12px; }
    .vsg { padding: 7px 5px; font-size: 11.5px; }
    .vu { padding: 8px 7px; font-size: 13px; }
    #vsearch { font-size: 16px; padding: 9px 10px; }         /* no zoom-on-focus on iOS */
    .vsel { font-size: 13px; padding: 7px 6px; }
    #vboard { cursor: pointer; }
    .vtable { font-size: 12px; }
    .vtable th { font-size: 10.5px; }
    .vrule { font-size: 13px; }
    .vweap { font-size: 13px; }
  }
  @media (max-width: 1000px) and (min-width: 701px) {
    .vstage { height: 46vh; max-height: 520px; }
  }
  /* a finger, whatever the width: every control big enough to hit */
  @media (pointer: coarse) {
    .vsw { gap: 7px; }
    .vsw button { width: 36px; height: 36px; }
    .vsg { padding: 9px 5px; font-size: 12px; min-height: 38px; }
    .vbtn { min-height: 44px; }
    .vu { min-height: 44px; padding: 8px 8px; }
    .vu-w { font-size: 10.5px; }
    input[type=range] { height: 28px; }
  }
  .atl {
    grid-column: 2 / 4; display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  /* the cards and sheets, in the Atlas and in the unit list alike */
  .atl { --field: #5e5039; --field-edge: #2e271c; }
  /* the unit list: the same cards, a size down, two to a row, the one on the stage picked out */
  #vlist h2.faction { font-family: var(--display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin: 12px 0 0 3px; }
  #vlist h3.group { font-size: 9px; margin: 12px 0 6px; padding: 0 0 4px 3px; }
  #vlist section[data-group]:first-child h3.group { margin-top: 2px; }
  #vlist .cards { gap: 6px; }
  #vlist .card.unit { padding: 5px 5px 6px; }
  #vlist .card.unit .nm { font-size: 11.5px; margin-bottom: 4px; }
  #vlist .card.unit h4 .code { font-size: 10px; padding: 0 5px; }
  #vlist .card.unit.on { border-color: var(--alpha); background: color-mix(in srgb, var(--alpha) 14%, var(--panel-2)); }
  #vlist canvas.tile { width: 112px; height: 95px; }
  #vlist canvas.tile.tall { height: 122px; }
  #vlist canvas.tile.inf { width: 120px; height: 96px; }
  #vlist figure.cell figcaption { display: none; }
  #vlist .card .tiles .cell ~ .cell { display: none; }     /* one picture a card: a mounted unit on its first mount */
  .vatbar { flex: none; display: flex; flex-direction: column; gap: 7px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .atl h3.group {
    font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
    margin: 16px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .atl .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .atl .unit { cursor: pointer; scroll-margin-top: 8px; }
  .atl .unit:hover { border-color: var(--alpha); }
  .atl .card.unit {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 7px 8px;
    width: min-content; display: flex; flex-direction: column;
  }
  .atl .card.unit h4 { margin: 0 0 3px; display: flex; gap: 6px; align-items: baseline; contain: inline-size; }
  .atl .card.unit h4 .tier { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-left: auto; flex-shrink: 0; }
  .atl .card.unit .nm { font-family: var(--display); font-size: 13px; font-weight: 600; line-height: 1.15; min-height: 2.35em; margin-bottom: 5px; contain: inline-size; text-wrap: balance; }
  .atl .card .tiles { display: flex; gap: 5px; margin-top: auto; align-items: flex-end; }
  .atl .code { font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--alpha); color: #1a1408; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
  .atl article.unit { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; margin-bottom: 10px; }
  .atl article.unit header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; margin-bottom: 8px; padding: 0; border: 0; }
  .atl .uname { font-family: var(--display); font-size: 16px; font-weight: 600; }
  .atl .meta { color: var(--ink-faint); font-size: 11.5px; }
  .atl .meta code { font-family: var(--mono); font-size: 11px; }
  .atl .sheet { overflow-x: auto; }
  .atl .grid { display: grid; gap: 5px; }
  .atl .row { display: grid; grid-template-columns: 70px repeat(8, 132px); gap: 5px; align-items: center; min-width: max-content; }
  .atl .row.head div, .atl .row .lab, .atl figure.cell figcaption {
    font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
  }
  .atl .row.head div { text-align: center; }
